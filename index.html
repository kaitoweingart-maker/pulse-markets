<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE · Markets & World</title>
<style>
:root{
  --bg:#0a0a0c; --panel:#111114; --line:rgba(255,255,255,.07);
  --txt:#f4f4f5; --dim:#8b8b93; --dim2:#55555c;
  --up:#34d399; --down:#f87171; --acc:#e0b45c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:#26262c transparent}
body{background:var(--bg);color:var(--txt);
  font-family:ui-sans-serif,-apple-system,'Inter','Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px 80px}

header{display:flex;justify-content:space-between;align-items:baseline;
  padding:26px 0 22px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 82%,transparent);z-index:5}
.logo{font-size:17px;font-weight:800;letter-spacing:.34em}
.logo span{color:var(--acc)}
.clock{font-size:12px;color:var(--dim);letter-spacing:.06em}

.label{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim2);margin:40px 0 14px;display:flex;align-items:center;gap:10px}
.label:after{content:"";flex:1;height:1px;background:var(--line)}

/* markets grid */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mcell{background:var(--bg);padding:14px 16px;transition:background .2s}
.mcell:hover{background:var(--panel)}
.mcell .n{font-size:11.5px;color:var(--dim);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcell .p{font-size:16px;font-weight:650;letter-spacing:-.01em}
.mcell .c{font-size:12px;margin-top:2px;font-weight:600}
.mcell svg{display:block;margin-top:8px;width:100%;height:26px;opacity:.9}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--dim)}

/* two-col layout */
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:44px}
@media(max-width:980px){.cols{grid-template-columns:1fr}}

/* theme chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:100px;padding:6px 15px;font-size:12px;
  color:var(--dim);cursor:pointer;background:none;letter-spacing:.04em;transition:.15s}
.chip:hover{color:var(--txt);border-color:#3a3a42}
.chip.on{color:var(--bg);background:var(--txt);border-color:var(--txt);font-weight:650}

/* stock rows */
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto auto auto;gap:16px;align-items:center;
  padding:11px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--panel)}
.row .sym{font-weight:650;font-size:13px}
.row .nm{color:var(--dim);font-size:11.5px;margin-top:1px}
.row svg{width:76px;height:22px}
.row .pr{font-weight:600;font-size:13.5px;text-align:right;min-width:76px}
.row .ch{font-weight:650;font-size:12.5px;text-align:right;min-width:62px}

/* movers */
.mv{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.mv{grid-template-columns:1fr}}
.mvcol .mvh{font-size:10.5px;letter-spacing:.18em;color:var(--dim2);text-transform:uppercase;margin-bottom:8px}
.mvrow{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px}
.mvrow:last-child{border-bottom:none}
.mvrow b{font-weight:650}
.mvrow span.nm{color:var(--dim);font-size:12px;margin-left:8px;font-weight:400}

/* news */
.ntabs{display:flex;gap:6px;margin-bottom:12px}
.nitem{display:block;padding:11px 2px;border-bottom:1px solid var(--line)}
.nitem:last-child{border-bottom:none}
.nitem .t{font-size:13.5px;line-height:1.45;transition:color .15s}
.nitem:hover .t{color:var(--acc)}
.nitem .m{font-size:11px;color:var(--dim2);margin-top:3px;letter-spacing:.04em}

/* gdp */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gcell{background:var(--bg);padding:15px 16px}
.gcell:hover{background:var(--panel)}
.gcell .cn{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:8px}
.gcell .gsize{color:var(--acc);font-weight:650;font-size:11.5px;letter-spacing:.02em}
.gcell .gv{font-size:19px;font-weight:700;margin-top:4px}
.gcell .gy{font-size:10.5px;color:var(--dim2);margin-left:6px;font-weight:400}
.gbars{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:10px}
.gbar{flex:1;border-radius:2px 2px 0 0;min-height:2px;position:relative}
.gbar.pos{background:rgba(52,211,153,.55)}
.gbar.neg{background:rgba(248,113,113,.55);align-self:flex-start;border-radius:0 0 2px 2px}
.gyrs{display:flex;justify-content:space-between;font-size:9px;color:var(--dim2);margin-top:4px}

footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11px;color:var(--dim2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.skel{color:var(--dim2);font-size:12.5px;padding:18px 6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">PULSE<span>.</span></div>
    <div class="clock num" id="clock"></div>
  </header>

  <div class="label">Global Markets</div>
  <div class="mgrid" id="markets"><div class="skel">Loading markets…</div></div>

  <div class="cols">
    <div>
      <div class="label">Themes & Momentum</div>
      <div class="chips" id="chips"></div>
      <div class="rows" id="theme"><div class="skel">Loading…</div></div>

      <div class="label">Top Movers · Universe</div>
      <div class="mv" id="movers"><div class="skel">Loading…</div></div>

      <div class="label">GDP Growth · Real, annual % (World Bank)</div>
      <div class="ggrid" id="gdp"><div class="skel">Loading…</div></div>
    </div>

    <div>
      <div class="label">World & Markets — Live Wire</div>
      <div class="ntabs chips" id="ntabs">
        <button class="chip on" data-cat="all">All</button>
        <button class="chip" data-cat="markets">Markets</button>
        <button class="chip" data-cat="world">World</button>
      </div>
      <div id="news"><div class="skel">Loading news…</div></div>
    </div>
  </div>

  <footer>
    <div>PULSE — personal dashboard. Data: Yahoo Finance (delayed), World Bank, public RSS wires.</div>
    <div id="updated" class="num"></div>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const fmtP = (v, cur) => v == null ? '—' :
  v >= 1000 ? v.toLocaleString('en-US', {maximumFractionDigits: 0}) :
  v.toLocaleString('en-US', {maximumFractionDigits: 2});
const cls = c => c == null ? 'flat' : c > 0.001 ? 'up' : c < -0.001 ? 'down' : 'flat';
const sign = c => c == null ? '—' : (c > 0 ? '+' : '') + c.toFixed(2) + '%';

function spark(vals, chg) {
  if (!vals || vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), rng = (max - min) || 1;
  const pts = vals.map((v, i) =>
    `${(i / (vals.length - 1) * 100).toFixed(1)},${(26 - (v - min) / rng * 24).toFixed(1)}`).join(' ');
  const col = chg == null ? '#8b8b93' : chg >= 0 ? '#34d399' : '#f87171';
  return `<svg viewBox="0 0 100 26" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

async function j(url) {
  const r = await fetch(url);
  const d = await r.json();
  if (d && d.error) throw new Error(d.error);
  return d;
}

// resilient loader: keeps retrying with backoff instead of showing nothing
const retryTimers = {};
function resilient(name, fn, el, intervalMs = 20000, maxTries = 30) {
  clearTimeout(retryTimers[name]);
  let tries = 0;
  const attempt = async () => {
    tries++;
    try { await fn(); }
    catch (e) {
      if (el && $(el)) $(el).innerHTML =
        `<div class="skel">Loading… retrying (${tries}) — data source waking up.</div>`;
      if (tries < maxTries)
        retryTimers[name] = setTimeout(attempt, Math.min(intervalMs * Math.pow(1.3, Math.min(tries, 8)), 120000));
    }
  };
  return attempt();
}

async function loadMarkets() {
  const data = await j('/api/markets');
  if (!data.length || data.every(q => q.price == null)) throw new Error('empty');
  $('markets').innerHTML = data.map(q => `
    <div class="mcell">
      <div class="n">${q.name}</div>
      <div class="p num">${fmtP(q.price)}</div>
      <div class="c num ${cls(q.changePct)}">${sign(q.changePct)}</div>
      ${spark(q.spark, q.changePct)}
    </div>`).join('');
}

let themeNames = [], activeTheme = 'ai';
async function loadChips() {
  themeNames = await j('/api/themes');
  $('chips').innerHTML = themeNames.map(t =>
    `<button class="chip ${t === activeTheme ? 'on' : ''}" data-t="${t}">${t.toUpperCase()}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    activeTheme = b.dataset.t;
    $('chips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    $('theme').innerHTML = '<div class="skel">Loading…</div>';
    resilient('theme', loadTheme, 'theme');
  });
}
async function loadTheme() {
  const data = await j('/api/theme/' + activeTheme);
  const rows = data.filter(q => q.price != null)
    .sort((a, b) => (b.changePct ?? -99) - (a.changePct ?? -99));
  if (!rows.length) throw new Error('empty');
  $('theme').innerHTML = rows.map(q => `
    <div class="row">
      <div><div class="sym">${q.symbol.replace('-USD','').replace('.SW','')}</div>
           <div class="nm">${q.name}</div></div>
      ${spark(q.spark, q.changePct)}
      <div class="pr num">${fmtP(q.price)}</div>
      <div class="ch num ${cls(q.changePct)}">${sign(q.changePct)}</div>
    </div>`).join('');
}

async function loadMovers() {
  const d = await j('/api/movers');
  if (!d.gainers || !d.gainers.length) throw new Error('empty');
  const col = (title, arr) => `
    <div class="mvcol"><div class="mvh">${title}</div>
    ${arr.map(q => `<div class="mvrow"><div><b>${q.symbol.replace('.SW','')}</b>
      <span class="nm">${q.name}</span></div>
      <div class="num ${cls(q.changePct)}">${sign(q.changePct)}</div></div>`).join('')}</div>`;
  $('movers').innerHTML = col('Gainers', d.gainers) + col('Losers', d.losers);
}

let newsItems = [], newsCat = 'all';
async function loadNews() {
  newsItems = await j('/api/news');
  if (!newsItems.length) throw new Error('empty');
  renderNews();
}
function renderNews() {
  const items = newsItems.filter(n => newsCat === 'all' || n.category === newsCat).slice(0, 18);
  $('news').innerHTML = items.map(n => {
    const age = n.ts ? Math.max(0, (Date.now() / 1000 - n.ts) / 3600) : null;
    const when = age == null ? '' : age < 1 ? `${Math.round(age * 60)}m` :
      age < 24 ? `${Math.round(age)}h` : `${Math.round(age / 24)}d`;
    return `<a class="nitem" href="${n.link}" target="_blank" rel="noopener">
      <div class="t">${n.title}</div>
      <div class="m">${n.source}${when ? ' · ' + when + ' ago' : ''}</div></a>`;
  }).join('') || '<div class="skel">Nothing here.</div>';
}
$('ntabs').querySelectorAll('.chip').forEach(b => b.onclick = () => {
  newsCat = b.dataset.cat;
  $('ntabs').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  renderNews();
});

const fmtGdp = v => v == null ? '' :
  v >= 1e12 ? '$' + (v / 1e12).toFixed(v >= 1e13 ? 1 : 2) + 'T' :
  '$' + Math.round(v / 1e9) + 'B';

async function loadGdp() {
  const data = await j('/api/gdp');
  if (!data.length) throw new Error('empty');
  $('gdp').innerHTML = data.map(c => {
    const vals = c.series.map(s => s.value);
    const maxAbs = Math.max(...vals.map(Math.abs), 1);
    const bars = c.series.map(s =>
      `<div class="gbar ${s.value >= 0 ? 'pos' : 'neg'}" title="${s.year}: ${s.value}%"
        style="height:${Math.max(6, Math.abs(s.value) / maxAbs * 100)}%"></div>`).join('');
    return `<div class="gcell">
      <div class="cn">${c.name}
        <span class="gsize num">${fmtGdp(c.gdpUsd)}</span></div>
      <div class="gv num ${cls(c.latest)}">${c.latest > 0 ? '+' : ''}${c.latest}%
        <span class="gy">growth ${c.latestYear}</span></div>
      <div class="gbars">${bars}</div>
      <div class="gyrs"><span>${c.series[0].year}</span><span>${c.latestYear}</span></div>
    </div>`;
  }).join('');
}

function tick() {
  const now = new Date();
  $('clock').textContent = now.toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}) +
    ' · ' + now.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
}
function stamp() { $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB'); }

function refresh() {
  resilient('markets', loadMarkets, 'markets');
  resilient('theme', loadTheme, 'theme');
  resilient('movers', loadMovers, 'movers');
  resilient('news', loadNews, 'news');
  resilient('gdp', loadGdp, 'gdp');
  stamp();
}
tick(); setInterval(tick, 30000);
loadChips().then(refresh).catch(() => setTimeout(() => loadChips().then(refresh), 15000));
setInterval(() => {
  resilient('markets', loadMarkets, 'markets');
  resilient('theme', loadTheme, 'theme');
  resilient('movers', loadMovers, 'movers');
  stamp();
}, 5 * 60 * 1000);
setInterval(() => resilient('news', loadNews, 'news'), 10 * 60 * 1000);
</script>
</body>
</html>
